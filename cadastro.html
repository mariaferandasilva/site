<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar Conta | Essencial Perfumes</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="pagina-cadastro">


    <main class="cadastro-container">

        <div class="cadastro-box">


            <!-- LOGO -->

            <div class="logo-cadastro">

                <img
                    src="logo.jpg"
                    alt="Logo da Essenza Perfumes"
                >

            </div>


            <h1>
                Essencial
            </h1>


            <p class="subtitulo">

                Crie sua conta e descubra
                sua fragrância.

            </p>


            <!-- FORMULÁRIO -->

            <form id="cadastroForm">


                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="linha">

                    <div class="campo">

                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            inputmode="numeric"
                            autocomplete="off"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Mín. 6 caracteres"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <div class="campo">

                    <label for="endereco">
                        Endereço
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Rua, número, bairro e cidade"
                        autocomplete="street-address"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao"
                >
                    Criar minha conta ✨
                </button>

            </form>


            <div id="mensagem"></div>


            <div class="links">

                <p>

                    Já possui uma conta?

                    <button
                        type="button"
                        onclick="window.location.href='login.html'"
                    >
                        Entrar
                    </button>

                </p>


                <button
                    type="button"
                    class="voltar"
                    onclick="window.location.href='index.html'"
                >
                    ← Voltar para a loja
                </button>

            </div>


        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
